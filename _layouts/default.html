<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta标签 -->
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="keywords" content="{{ site.keywords | join: ', ' }}">
  <meta name="author" content="{{ site.author }}">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{{ site.og_image }}">
  <meta property="og:locale" content="zh_CN">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.og_image }}">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ site.url }}/assets/images/favicon.png">
  
  <!-- 样式 -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.time | relative_url }}">
  
  <!-- Google Analytics（可选） -->
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
  
  <!-- 结构化数据（Schema.org） -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "{{ site.title }}",
    "description": "{{ site.description }}",
    "applicationCategory": "SecurityApplication",
    "operatingSystem": "Windows, macOS, iOS, Android, Linux",
    "offers": {
      "@type": "Offer",
      "price": "9.99",
      "priceCurrency": "CNY"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "1250"
    }
  }
  </script>
</head>

<body>
  <!-- 页眉 -->
  <header class="page-header">
    <div class="container">
      <img src="{{ site.logo }}" alt="{{ site.title }}" class="logo">
      <h1 class="project-name">{{ site.title }}</h1>
      <h2 class="project-tagline">{{ site.description }}</h2>
      
      <div class="cta-buttons">
        <a href="https://jumpervpn.com" class="btn btn-primary">立即使用</a>
        <a href="https://github.com/jumpervpn/client" class="btn btn-secondary">GitHub</a>
      </div>
    </div>
  </header>

  <!-- 主要内容 -->
  <main class="main-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2024-2026 {{ site.title }}. All rights reserved.</p>
      <p>
        <a href="/privacy">隐私政策</a> | 
        <a href="/terms">服务条款</a> | 
        <a href="mailto:support@jumpervpn.com">联系我们</a>
      </p>
      <p class="footer-links">
        关注我们：
        <a href="https://x.com/jumper_vpn">X.com</a>
        <a href="https://www.youtube.com/@jumper_vpn">YouTuBe</a>
        <a href="https://t.me/jumper_vpn">Telegram</a>
      </p>
    </div>
  </footer>

  <!-- 回到顶部按钮 -->
  <button id="back-to-top" title="回到顶部">↑</button>

  <script>
    // 回到顶部功能
    const backToTopButton = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
      if (window.pageYOffset > 300) {
        backToTopButton.style.display = 'block';
      } else {
        backToTopButton.style.display = 'none';
      }
    });
    backToTopButton.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
